<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0b3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dino Riders" />
    <link rel="apple-touch-icon" href="icons/icone-180.png" />
    <link rel="icon" type="image/png" href="icons/icone-192.png" />
    <title>Dino Riders : l'île aux Échos</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #1a0b3a;
        /* Pas de zoom, de sélection ni de défilement au toucher */
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none;
      }
      #jeu { width: 100%; height: 100%; }
      /* Écran « tourne ton téléphone » (sans texte), affiché seulement en portrait */
      #tourne {
        display: none; position: fixed; inset: 0; z-index: 10; background: #1a0b3a;
        align-items: center; justify-content: center;
      }
      #tourne .tel {
        width: 90px; height: 160px; border: 8px solid #ffd84a; border-radius: 18px;
        animation: tourner 2s ease-in-out infinite;
      }
      @keyframes tourner { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { #tourne { display: flex; } }
    </style>
  </head>
  <body>
    <div id="jeu"></div>
    <div id="tourne"><div class="tel"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
